include ':app'
project(':app').projectDir = new File('./android/app')

include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./android/capacitor-cordova-android-plugins')

include ':capacitor-android'
def capDir = new File(rootDir, 'node_modules/@capacitor/android/capacitor')
if (!capDir.exists()) {
    capDir = new File(rootDir, 'android/../node_modules/@capacitor/android/capacitor')
}
project(':capacitor-android').projectDir = capDir

include ':codetrix-studio-capacitor-google-auth'
def googleAuthDir = new File(rootDir, 'node_modules/@codetrix-studio/capacitor-google-auth/android')
if (!googleAuthDir.exists()) {
    googleAuthDir = new File(rootDir, 'android/../node_modules/@codetrix-studio/capacitor-google-auth/android')
}
project(':codetrix-studio-capacitor-google-auth').projectDir = googleAuthDir

