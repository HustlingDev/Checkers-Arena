// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
            force 'androidx.activity:activity:1.9.3'
            force 'androidx.activity:activity-ktx:1.9.3'
            force 'androidx.fragment:fragment:1.8.5'
            force 'androidx.fragment:fragment-ktx:1.8.5'
        }
    }
}

subprojects {
    project.ext {
        compileSdkVersion = rootProject.ext.compileSdkVersion
        targetSdkVersion = rootProject.ext.targetSdkVersion
        minSdkVersion = rootProject.ext.minSdkVersion
        androidxActivityVersion = rootProject.ext.androidxActivityVersion
        androidxAppCompatVersion = rootProject.ext.androidxAppCompatVersion
        androidxCoordinatorLayoutVersion = rootProject.ext.androidxCoordinatorLayoutVersion
        androidxCoreVersion = rootProject.ext.androidxCoreVersion
        androidxFragmentVersion = rootProject.ext.androidxFragmentVersion
        coreSplashScreenVersion = rootProject.ext.coreSplashScreenVersion
        androidxWebkitVersion = rootProject.ext.androidxWebkitVersion
        junitVersion = rootProject.ext.junitVersion
        androidxJunitVersion = rootProject.ext.androidxJunitVersion
        androidxEspressoCoreVersion = rootProject.ext.androidxEspressoCoreVersion
        cordovaAndroidVersion = rootProject.ext.cordovaAndroidVersion
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
